name: Build Windows EXE & macOS DMG

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos-dmg:
    name: macOS Apple Silicon (.dmg)
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Vulkan, MoltenVK, GLFW & Shaderc via Homebrew
        run: |
          brew install cmake glfw vulkan-headers vulkan-loader molten-vk shaderc

      - name: Configure & Build (Release)
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release -j$(sysctl -n hw.ncpu)

      - name: Package macOS App Bundle & Create DMG
        run: |
          APP_DIR="dist/NFSU2 BIN Opener.app"
          mkdir -p "$APP_DIR/Contents/MacOS"
          mkdir -p "$APP_DIR/Contents/Resources/shaders"

          cp build/nfsu2_vulkan "$APP_DIR/Contents/MacOS/NFSU2_BIN_Opener"
          cp build/shaders/vert.spv "$APP_DIR/Contents/Resources/shaders/"
          cp build/shaders/frag.spv "$APP_DIR/Contents/Resources/shaders/"

          cat > "$APP_DIR/Contents/MacOS/launcher.sh" << 'EOF'
          #!/bin/bash
          DIR="$(cd "$(dirname "$0")" && pwd)"
          RES="$(cd "$DIR/../Resources" && pwd)"
          export VK_ICD_FILENAMES="/opt/homebrew/etc/vulkan/icd.d/MoltenVK_icd.json:/usr/local/etc/vulkan/icd.d/MoltenVK_icd.json"
          export DYLD_FALLBACK_LIBRARY_PATH="/opt/homebrew/lib:/usr/local/lib"
          cd "$RES"
          exec "$DIR/NFSU2_BIN_Opener" "$@"
          EOF
          chmod +x "$APP_DIR/Contents/MacOS/launcher.sh" "$APP_DIR/Contents/MacOS/NFSU2_BIN_Opener"

          cat > "$APP_DIR/Contents/Info.plist" << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>launcher.sh</string>
              <key>CFBundleIdentifier</key>
              <string>com.opensource.nfsu2.binopener</string>
              <key>CFBundleName</key>
              <string>NFSU2 BIN Opener</string>
              <key>CFBundleDisplayName</key>
              <string>NFSU2 BIN Opener</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0.0</string>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          EOF

          ln -s /Applications dist/Applications
          hdiutil create -volname "NFSU2 BIN Opener" \
                         -srcfolder dist \
                         -ov -format UDZO \
                         NFSU2-BIN-Opener-macOS-AppleSilicon.dmg

      - name: Upload macOS DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NFSU2-BIN-Opener-macOS-AppleSilicon-DMG
          path: NFSU2-BIN-Opener-macOS-AppleSilicon.dmg

  build-windows-exe:
    name: Windows x64 (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install LunarG Vulkan SDK (Headers, Loader & glslc)
        shell: pwsh
        run: |
          $vulkanSdkPath = "C:\VulkanSDK\latest"
          if (-not (Test-Path "$vulkanSdkPath\Bin\glslc.exe")) {
            Write-Host "Downloading latest LunarG Vulkan SDK..."
            $url = "https://sdk.lunarg.com/sdk/download/latest/windows/vulkan-sdk.exe"
            curl.exe -L -f -sS $url -o vulkan-sdk.exe
            Write-Host "Installing LunarG Vulkan SDK to $vulkanSdkPath..."
            Start-Process -FilePath ".\vulkan-sdk.exe" -ArgumentList "--root", "$vulkanSdkPath", "--accept-licenses", "--default-answer", "--confirm-command", "install" -Wait
          }
          "VULKAN_SDK=$vulkanSdkPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$vulkanSdkPath\Bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Configure & Build Windows Executable (Release)
        shell: pwsh
        run: |
          cmake -B build -A x64 -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --parallel

      - name: Stage Windows Portable Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/shaders | Out-Null
          if (Test-Path "build/Release/nfsu2_vulkan.exe") {
            Copy-Item "build/Release/nfsu2_vulkan.exe" "dist/NFSU2_BIN_Opener.exe"
            Copy-Item "build/Release/nfsu2_vulkan.exe" "NFSU2_BIN_Opener.exe"
          } else {
            Copy-Item "build/nfsu2_vulkan.exe" "dist/NFSU2_BIN_Opener.exe"
            Copy-Item "build/nfsu2_vulkan.exe" "NFSU2_BIN_Opener.exe"
          }
          Copy-Item "build/shaders/vert.spv" "dist/shaders/vert.spv"
          Copy-Item "build/shaders/frag.spv" "dist/shaders/frag.spv"
          Copy-Item "README.md" "dist/README.md"
          Compress-Archive -Path dist/* -DestinationPath NFSU2-BIN-Opener-Windows-x64.zip -Force

      - name: Upload Windows EXE & Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NFSU2-BIN-Opener-Windows-x64-EXE
          path: |
            NFSU2_BIN_Opener.exe
            NFSU2-BIN-Opener-Windows-x64.zip

  release:
    name: Publish GitHub Release
    needs: [ build-macos-dmg, build-windows-exe ]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create / Update GitHub Release with DMG & EXE
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.0' }}
          name: "Open NFS BIN Viewer ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.0' }} — Windows (x64) & macOS (Apple Silicon)"
          prerelease: false
          draft: false
          body: |
            ## 🏎️ Open NFS BIN Viewer — Native Vulkan 3D `.BIN` & `.BUN` Inspector

            Universal hardware-accelerated 3D geometry, map, and texture pack (`JDLZ` / `TPK`) inspector for **Need for Speed: Underground 2** *(Fully Tested & Verified)*, **Need for Speed: Most Wanted (2005)**, and **Need for Speed: Carbon (2006)**.

            ---

            ### 📦 Platform Downloads (Which file should I download?)

            | Operating System | Architecture | File to Download | Description & Setup |
            | :--- | :--- | :--- | :--- |
            | **🍎 macOS** | **Apple Silicon (`M1` / `M2` / `M3` / `M4` - ARM64)** | **`NFSU2-BIN-Opener-macOS-AppleSilicon.dmg`** | **macOS Disk Image** containing `NFSU2 BIN Opener.app` (native Vulkan via **MoltenVK**).<br>1. Install runtime libraries via Homebrew: `brew install glfw vulkan-loader molten-vk`<br>2. Open the `.dmg`, drag **`NFSU2 BIN Opener.app`** to `/Applications`, and launch. |
            | **🪟 Windows** | **64-bit (`x64`)** | **`NFSU2-BIN-Opener-Windows-x64.zip`** *(Recommended)* | **Complete Portable Windows Package** containing `NFSU2_BIN_Opener.exe` and the compiled SPIR-V `shaders/` folder.<br>1. Extract the `.zip` archive to any folder.<br>2. Double-click **`NFSU2_BIN_Opener.exe`** (keep `shaders/` next to the `.exe`). |
            | **🪟 Windows** | **64-bit (`x64`)** | **`NFSU2_BIN_Opener.exe`** | Standalone Windows 64-bit executable (requires the `shaders/vert.spv` and `shaders/frag.spv` folder in the working directory). |

            ---

            ### ✨ Highlights in This Release
            - **VS Code-Style File Explorer Sidebar** with instant asset badges (`CAR`, `3D`, `MAP`, `TEX`, `DIR`) & diagnostic alerts for unsupported files.
            - **Chrome / VS Code Multi-Tab Bar** — open multiple `.BIN` / `.BUN` files simultaneously with zero background GPU overhead.
            - **Blender-Style 3D Viewport Header Bar** — clickable **`[ − ]` / `[ + ]` Zoom**, **Live Zoom Percentage & Distance Readout (`Zoom 100% (4.5m)`)**, **`[ ⌖ Reset View ]`**, **Wireframe Mode (`Z`)**, **Textures Toggle (`T`)**, **Auto-Rotate (`Space`)**, and **7 Paint Swatches (`1..7`)**.
            - **`WASD` + `Q/E` Free-Flight Camera** (`Shift` for `3.5x` turbo speed) + **Right-Click Drag Pan** + wide-range zoom (`0.05m` to `300.0m`) to explore showrooms (`MegaloShop01.BIN`, `CarLot01.BIN`) and Bayview map districts (`STREAML4RA..J.BUN`).
          files: |
            artifacts/NFSU2-BIN-Opener-macOS-AppleSilicon-DMG/NFSU2-BIN-Opener-macOS-AppleSilicon.dmg
            artifacts/NFSU2-BIN-Opener-Windows-x64-EXE/NFSU2-BIN-Opener-Windows-x64.zip
            artifacts/NFSU2-BIN-Opener-Windows-x64-EXE/NFSU2_BIN_Opener.exe
